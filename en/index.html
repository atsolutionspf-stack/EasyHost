            "@type": "UnitPriceSpecification",
            "price": "39",
            "priceCurrency": "EUR",
            "unitCode": "MON",
            "valueAddedTaxIncluded": false
          }
        }
      ]
    },
    {
      "@type": "FAQPage",
      "inLanguage": "en",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Clientia right for my type of business?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It’s built for shops, hospitality and service businesses that serve customers every day. Floor and kitchen features, such as the floor plan, table tickets or the KDS, are specific to hospitality."
          }
        },
        {
          "@type": "Question",
          "name": "Do prices include VAT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Essential costs €19/month and Professional €39/month, excluding VAT. The Custom plan is quoted based on your locations and needs."
          }
        },
        {
          "@type": "Question",
          "name": "How many locations can I manage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Essential includes 1 location and Professional up to 3. If you have more than 3, the Custom plan adapts to your group or chain."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if the internet goes down?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The POS includes an offline mode so you can keep working even if you lose your connection."
          }
        },
        {
          "@type": "Question",
          "name": "What does “Coming soon” mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "These are features in development, such as VeriFactu invoicing or delivery integrations. They will be enabled once they are ready and validated."
          }
        },
        {
          "@type": "Question",
          "name": "Do I have to set it up myself?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. We adapt the platform to your business, with your products, prices and opening hours, so you can start using it without technical knowledge."
          }
        },
        {
          "@type": "Question",
          "name": "Can I have my own connected website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, with the “Your own connected website” add-on (+€29/month). We design it with Lintel, with bookings and orders connected to Clientia."
          }
        }
