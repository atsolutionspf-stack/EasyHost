<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO de la versión en español. La versión en inglés está en en/index.html -->
    <title>Clientia | TPV y CRM para tu negocio</title>
    <meta

      content="Clientia es el TPV y CRM para comercios, hostelería y servicios: ventas, caja, stock, reservas, pedidos online, Verifactu y la ficha de cada cliente en una única plataforma. Solicita una demo."

    <meta name="theme-color" content="#1d2540" />

    <link rel="canonical" href="https://www.clientia.example/" />
