<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO de la versión en español. La versión en inglés está en en/index.html -->
    <title>Clientia | Software TPV y CRM para tu negocio</title>
    <meta
      name="description"
      content="TPV y CRM para comercios, hostelería y servicios: ventas, caja, reservas, pedidos y clientes en una plataforma. Desde 19 €/mes. Solicita una demo."
    />
    <meta name="theme-color" content="#1d2540" />
    <!-- Sustituye por el dominio definitivo -->
    <link rel="canonical" href="https://www.clientia.example/" />
    <link rel="alternate" hreflang="es" href="https://www.clientia.example/" />
    <link rel="alternate" hreflang="en" href="https://www.clientia.example/en/" />
    <link rel="alternate" hreflang="x-default" href="https://www.clientia.example/" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Clientia" />
    <meta property="og:title" content="Clientia | Software TPV y CRM para tu negocio" />
    <meta
      property="og:description"
      content="Ventas, caja, stock, pedidos y clientes en una única plataforma."
    />
    <meta property="og:url" content="https://www.clientia.example/" />
    <meta property="og:image" content="https://www.clientia.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Datos estructurados para Google. Si cambias precios o preguntas, actualízalos también aquí. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": "Clientia",
      "url": "https://www.clientia.example/",
      "email": "contacto@clientia.example"
    },
    {
      "@type": "SoftwareApplication",
      "name": "Clientia",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "inLanguage": "es",
      "url": "https://www.clientia.example/",
      "description": "TPV y CRM para comercios, hostelería y servicios: ventas, caja, reservas, pedidos y clientes en una plataforma. Desde 19 €/mes. Solicita una demo.",
      "offers": [
        {
          "@type": "Offer",
          "name": "Essential",
          "price": "19",
          "priceCurrency": "EUR",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "19",
            "priceCurrency": "EUR",
            "unitCode": "MON",
            "valueAddedTaxIncluded": false
          }
        },
        {
          "@type": "Offer",
          "name": "Professional",
          "price": "39",
          "priceCurrency": "EUR",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "39",
            "priceCurrency": "EUR",
            "unitCode": "MON",
            "valueAddedTaxIncluded": false
          }
        }
      ]
    },
    {
      "@type": "FAQPage",
      "inLanguage": "es",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Clientia sirve para mi tipo de negocio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Está pensado para comercios, hostelería y servicios que atienden a sus clientes cada día. Las funciones de sala y cocina, como el plano de mesas, las comandas o el KDS, son específicas de hostelería."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los precios incluyen IVA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Essential cuesta 19 €/mes y Professional 39 €/mes, sin IVA. El plan Custom se presupuesta según tus locales y necesidades."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuántos locales puedo gestionar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Essential incluye 1 establecimiento y Professional, hasta 3. Si tienes más de 3, el plan Custom se adapta a tu grupo o cadena."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si se cae internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El TPV incluye modo offline para que puedas seguir trabajando aunque pierdas la conexión."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué significa «Próximamente»?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Son funciones en desarrollo, como la facturación VeriFactu o las integraciones de delivery. Se activarán cuando estén listas y validadas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Tengo que configurarlo yo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Adaptamos la plataforma a tu negocio, con tus productos, tus precios y tus horarios, para que empieces a usarla sin conocimientos técnicos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo tener mi propia web conectada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, con el add-on «Página web propia conectada» (+29 €/mes). La diseñamos con Lintel, con reservas y pedidos conectados a Clientia."
          }
        }
      ]
    }
  ]
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Clientia: TPV y CRM para comercios, hostelería y servicios. Activa JavaScript para ver la página.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
