<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico. Si cambias estos textos, cámbialos también en src/config/site.ts -->
    <title>EasyHost | Reservas y pedidos online para restaurantes</title>
    <meta
      name="description"
      content="EasyHost centraliza las reservas y los pedidos online de tu restaurante, bar o cafetería en una única plataforma. Solicita una demo."
    />
    <meta name="theme-color" content="#17282A" />
    <!-- Sustituye por el dominio definitivo -->
    <link rel="canonical" href="https://www.easyhost.example/" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="EasyHost" />
    <meta property="og:title" content="EasyHost | Reservas y pedidos online para restaurantes" />
    <meta
      property="og:description"
      content="Centraliza las reservas y los pedidos online de tu restaurante en una única plataforma."
    />
    <meta property="og:url" content="https://www.easyhost.example/" />
    <meta property="og:image" content="https://www.easyhost.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      EasyHost: software de reservas y pedidos online para restaurantes. Activa JavaScript para ver la página.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
