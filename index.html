<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico. Si cambias estos textos, cámbialos también en src/config/site.ts -->
    <title>EasyHost | TPV para restaurantes: sala, cocina, reservas y pedidos online</title>
    <meta
      name="description"
      content="EasyHost es el TPV para restaurantes, bares y cafeterías: sala, cocina, reservas, pedidos online, cierre de caja y Verifactu en una única plataforma. Solicita una demo."
    />
    <meta name="theme-color" content="#1d2540" />
    <!-- Sustituye por el dominio definitivo -->
    <link rel="canonical" href="https://www.easyhost.example/" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="EasyHost" />
    <meta property="og:title" content="EasyHost | TPV para restaurantes" />
    <meta
      property="og:description"
      content="Sala, cocina, reservas, pedidos online y cierre de caja en una única plataforma."
    />
    <meta property="og:url" content="https://www.easyhost.example/" />
    <meta property="og:image" content="https://www.easyhost.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      EasyHost: TPV para restaurantes, con sala, cocina, reservas y pedidos online. Activa JavaScript para ver la página.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
